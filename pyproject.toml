[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioRake"
version = "1.0.0"
description = "Domain-tuned RAKE search engine for ranking biomedical literature (PDF, DOCX, PPTX, Markdown, TXT) in the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Text Processing :: Indexing",
]
keywords = ["bioinformatics", "RAKE", "keyword extraction", "literature search", "oncology", "NLTK"]
dependencies = [
    "nltk>=3.8",
    "rich>=13",
    "pypdf>=3",
    "python-docx>=1.0",
    "python-pptx>=0.6.21",
]

[project.urls]
Homepage = "https://github.com/y-v-j/bioRake"

[project.scripts]
biorake = "biorake:main"

[tool.setuptools]
py-modules = ["biorake"]
